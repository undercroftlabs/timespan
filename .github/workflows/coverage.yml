name: 'Coverage'

on:
  pull_request:
    branches:
      - master
      - main
      - 'release/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ArtiomTr/jest-coverage-report-action@v2.2.4
        with:
          package-manager: pnpm
          test-script: test:cov
          working-directory: packages/timespan
