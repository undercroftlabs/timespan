name: Test

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.editorconfig'
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.editorconfig'
    branches:
      - main
      - master
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-node:
    name: Resolve Node versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      latest: ${{ steps.versions.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: node tools/supported-node-versions.cjs --github-output

  unit:
    name: test (${{ matrix.os }}, ${{ matrix.node }})
    needs: resolve-node
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node: ${{ fromJSON(needs.resolve-node.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install modules
        run: npm ci

      - name: Run tests with coverage and junit
        run: npm run test:ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-junit
          files: ./reports/junit.xml

  test:
    name: test
    needs: unit
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm unit matrix succeeded
        run: |
          set -euo pipefail
          if [ "${{ needs.unit.result }}" != "success" ]; then
            echo "Unit test matrix result: ${{ needs.unit.result }}"
            exit 1
          fi
