name: Release & Publish

on:
  push:
    tags:
      - 'v*'

# Least privilege at the workflow level. Jobs that need more (OIDC or
# contents: write) request it explicitly. Do not add workflow_dispatch here:
# npm Trusted Publishing authorizes this filename, and a manual trigger would
# inherit that authorization.
permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5

      - name: Validate tag format and package.json version
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag '$TAG'. Expected vMAJOR.MINOR.PATCH with an optional prerelease suffix."
            exit 1
          fi
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./packages/timespan/package.json').version")"
          if [[ "$VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag $TAG does not match package.json version $PKG_VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG from commit ${GITHUB_SHA}"

  unit-tests:
    name: Unit tests
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  dist-tests:
    name: Distribution tests
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:dist

  browser-tests:
    needs: validate-tag
    uses: ./.github/workflows/browser-tests.yml
    permissions:
      contents: read

  publish:
    name: Publish to npm
    needs:
      - validate-tag
      - unit-tests
      - dist-tests
      - browser-tests
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Ensure npm supports Trusted Publishing
        run: |
          set -euo pipefail
          node -v
          npm -v
          node -e "
            const { execSync } = require('child_process');
            const version = execSync('npm --version', { encoding: 'utf8' }).trim();
            const [major, minor, patch] = version.split('.').map(Number);
            const ok =
              major > 11 ||
              (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error('Trusted Publishing requires npm 11.5.1 or later. Found ' + version);
              process.exit(1);
            }
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the project
        run: pnpm run build

      - name: Publish to npm
        run: pnpm --filter @undercroft/timespan exec npm publish --access public

      - name: Verify npm publication
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./packages/timespan/package.json').name")"
          for attempt in 1 2 3 4 5 6; do
            PUBLISHED="$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null || true)"
            if [[ "$PUBLISHED" == "$VERSION" ]]; then
              echo "Verified ${PACKAGE_NAME}@${VERSION} on the npm registry."
              exit 0
            fi
            echo "Waiting for npm to show ${PACKAGE_NAME}@${VERSION} (attempt ${attempt})..."
            sleep 5
          done
          echo "npm publish appeared to succeed, but ${PACKAGE_NAME}@${VERSION} is not visible yet."
          exit 1

  github-release:
    name: Create GitHub Release
    needs:
      - validate-tag
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists. Skipping create (safe recovery)."
            exit 0
          fi
          node <<'EOF'
          const fs = require('fs');
          const version = process.env.VERSION;
          const text = fs.readFileSync('changelog.md', 'utf8');
          const heading = `## [${version}]`;
          const start = text.indexOf(heading);
          let notes;
          if (start === -1) {
            notes = `Release ${version}`;
          } else {
            const rest = text.slice(start);
            const next = rest.search(/\n## \[/);
            notes = (next === -1 ? rest : rest.slice(0, next)).trim();
          }
          fs.writeFileSync('release-notes.md', `${notes}\n`);
          EOF
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
