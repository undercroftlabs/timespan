name: 'Size Limit'
on:
  pull_request:
    branches:
      - main
      - 'release/**'
permissions:
  contents: read
  pull-requests: write
jobs:
  size-limit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Resolve latest supported Node LTS
        id: node
        run: node tools/supported-node-versions.mjs --github-output
      - uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.latest }}.x
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the project
        run: pnpm run build
      - name: Run size-limit
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: packages/timespan
          skip_step: install
